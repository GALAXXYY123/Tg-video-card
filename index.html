      height: 44px;

      display: flex;

      height: 60px;

      transition: all 0.3s ease;

    .tg-button:active {
      transform: translateX(-50%) scale(0.95);

    }

    .tg-icon {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .password-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      z-index: 1000;
      overflow: hidden;
      padding:
        env(safe-area-inset-top)

        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .password-panel.active {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crt-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.03),
          rgba(0,0,0,0.03) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      z-index: 1;
    }

    .glitch-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .glitch-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: rgba(0,0,0,0.1);
      animation: glitchMove 3s infinite;
    }

    .glitch-line:nth-child(1) {
      top: 20%;
      animation-delay: 0s;
    }

    .glitch-line:nth-child(2) {
      top: 40%;
      animation-delay: 0.5s;
    }

    .glitch-line:nth-child(3) {
      top: 60%;
      animation-delay: 1s;
    }

    .glitch-line:nth-child(4) {
      top: 80%;
      animation-delay: 1.5s;
    }

    @keyframes glitchMove {
      0%,100% {
        transform: translateX(0);
        opacity: 0.3;
      }

      50% {
        transform: translateX(-10px);
        opacity: 0.6;
      }
    }

    .password-content {
      position: relative;
      z-index: 2;
      background: #fff;
      border: 3px solid #000;
      border-radius: 20px;

      animation: glitchText 2s infinite;

    @keyframes glitchText {
      0%,90%,100% {
        text-shadow: none;
        transform: translate(0);
      }

      92% {
        text-shadow:
          -2px 0 #ff0000,
          2px 0 #00ffff;
        transform: translate(-2px,0);
      }

      94% {
        text-shadow:
          2px 0 #ff0000,

        transform: translate(2px,0);
      }

      96% {
        text-shadow: none;

<body>

<script>

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  /*
    ============================================
    CLOUDFLARE API
    ============================================
  */

  const API_URL =
    "https://polyana-video-api.another-galaxxy.workers.dev";


  /*
    ============================================
    СОСТОЯНИЕ
    ============================================
  */

  let videos = [];

  let adminSecret = "";

  let editingId = null;

  let logoClickCount = 0;

  let logoClickTimer = null;


  /*
    ============================================
    ЗАГРУЗКА ВИДЕО
    ============================================
  */

  async function loadAllVideos() {

    const feed =
      document.getElementById("videoFeed");

    feed.innerHTML =
      "<p style='text-align:center;color:#999;'>Загрузка...</p>";

    try {

      const response =
        await fetch(API_URL + "/videos");

      const data =
        await response.json();

      videos =
        Array.isArray(data.videos)
          ? data.videos
          : [];

      renderVideos();

    } catch (error) {

      console.error(error);

      feed.innerHTML =
        "<p style='text-align:center;color:#999;'>Не удалось загрузить видео</p>";

    }

  }


  /*
    ============================================
    ОТРИСОВКА
    ============================================
  */

  function renderVideos() {

    const feed =
      document.getElementById("videoFeed");

    if (!videos.length) {

      feed.innerHTML =
        "<p style='text-align:center;color:#999;'>Пока нет видео</p>";

      return;

    }


    feed.innerHTML =
      videos.map(video => {

        return `
          <div
            class="video-card"
            data-id="${escapeHtml(video.id)}"
          >

            <button
              class="delete-btn"
              onclick="deleteVideo('${escapeJs(video.id)}')"
            >
              ✕
            </button>

            <div
              class="video-wrapper ${video.aspect || "ratio-portrait"}"
            >

              ${createVideoIframe(video)}

            </div>

            <div class="caption">
              ${escapeHtml(video.title || "")}
            </div>

          </div>
        `;

      }).join("");

  }


  /*
    ============================================
    ПЛЕЕРЫ
    ============================================
  */

  function createVideoIframe(video) {

    const url =
      createEmbedUrl(
        video.platform,
        video.url
      );

    if (!url) {

      return `
        <div style="
          padding:30px;
          text-align:center;
          color:#777;
        ">
          Не удалось создать плеер
        </div>
      `;

    }


    return `
      <iframe
        src="${escapeHtml(url)}"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
        allowfullscreen
        loading="lazy"
      ></iframe>
    `;

  }


  function createEmbedUrl(platform, originalUrl) {

    if (!originalUrl) return "";


    /*
      VIMEO
    */

    if (platform === "vimeo") {

      let url =
        originalUrl.trim();

      let videoId = "";

      const match =
        url.match(/vimeo\.com\/(?:video\/)?(\d+)/);

      if (match) {

        videoId =
          match[1];

      }

      if (!videoId) {

        const playerMatch =
          url.match(/video\/(\d+)/);

        if (playerMatch) {

          videoId =
            playerMatch[1];

        }

      }

      if (!videoId) {

        return url;

      }


      const hashMatch =
        url.match(/[?&]h=([^&]+)/);

      const hash =
        hashMatch
          ? "&h=" + hashMatch[1]
          : "";


      return (
        "https://player.vimeo.com/video/" +
        videoId +
        "?autoplay=1" +
        "&muted=1" +
        "&loop=1" +
        "&autopause=0" +
        "&playsinline=1" +
        "&title=0" +
        "&byline=0" +
        "&portrait=0" +
        hash
      );

    }


    /*
      VK ВИДЕО

      Можно вставлять готовую embed-ссылку:
      https://vkvideo.ru/video_ext.php?...
    */

    if (platform === "vk") {

      if (
        originalUrl.includes("video_ext.php")
      ) {

        return originalUrl;

      }


      return originalUrl;

    }


    /*
      RUTUBE
    */

    if (platform === "rutube") {

      const match =
        originalUrl.match(
          /rutube\.ru\/video\/([a-zA-Z0-9_-]+)/
        );

      if (match) {

        return (
          "https://rutube.ru/play/embed/" +
          match[1]
        );

      }

      return originalUrl;

    }


    return originalUrl;

  }


  /*
    ============================================
    СОХРАНЕНИЕ ВИДЕО
    ============================================
  */

  async function saveVideo() {

    const platform =
      document.getElementById("videoPlatform").value;

    const url =
      document.getElementById("videoUrl").value.trim();

    const title =
      document.getElementById("videoTitle").value.trim();

    const aspect =
      document.getElementById("videoAspect").value;


    if (!url || !title) {

      alert(
        "Заполни ссылку и название!"
      );

      return;

    }


    const payload = {

      platform,
      url,
      title,
      aspect

    };


    try {

      let response;


      /*
        ДОБАВЛЕНИЕ
      */

      if (!editingId) {

        response =
          await fetch(
            API_URL + "/videos",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + adminSecret
              },

              body:
                JSON.stringify(payload)
            }
          );

      }


      /*
        РЕДАКТИРОВАНИЕ
      */

      else {

        response =
          await fetch(
            API_URL +
            "/videos/" +
            encodeURIComponent(editingId),
            {
              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  "Bearer " + adminSecret
              },

              body:
                JSON.stringify(payload)
            }
          );

      }


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка сохранения"
        );

      }


      showStatus(
        editingId
          ? "ВИДЕО ОБНОВЛЕНО"
          : "ВИДЕО ДОБАВЛЕНО"
      );


      cancelEdit();

      await loadAllVideos();

      updateVideoList();

    }

    catch (error) {

      console.error(error);

      alert(
        "Ошибка: " +
        error.message
      );

    }

  }


  /*
    ============================================
    УДАЛЕНИЕ
    ============================================
  */

  async function deleteVideo(id) {

    if (
      !confirm(
        "Удалить это видео?"
      )
    ) return;


    try {

      const response =
        await fetch(
          API_URL +
          "/videos/" +
          encodeURIComponent(id),
          {
            method: "DELETE",

            headers: {
              "Authorization":
                "Bearer " + adminSecret
            }
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка удаления"
        );

      }


      await loadAllVideos();

      updateVideoList();

    }

    catch (error) {

      alert(
        "Не удалось удалить видео: " +
        error.message
      );

    }

  }


  /*
    ============================================
    РЕДАКТИРОВАНИЕ
    ============================================
  */

  function editVideo(id) {

    const video =
      videos.find(
        item =>
          String(item.id) === String(id)
      );


    if (!video) return;


    editingId =
      video.id;


    document
      .getElementById("videoPlatform")
      .value =
      video.platform || "vimeo";


    document
      .getElementById("videoUrl")
      .value =
      video.url || "";


    document
      .getElementById("videoTitle")
      .value =
      video.title || "";


    document
      .getElementById("videoAspect")
      .value =
      video.aspect ||
      "ratio-portrait";


    document
      .getElementById("saveVideoBtn")
      .textContent =
      "СОХРАНИТЬ ИЗМЕНЕНИЯ";


    document
      .getElementById("cancelEditBtn")
      .style.display =
      "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  function cancelEdit() {

    editingId = null;


    document
      .getElementById("videoUrl")
      .value = "";


    document
      .getElementById("videoTitle")
      .value = "";


    document
      .getElementById("videoPlatform")
      .value = "vimeo";


    document
      .getElementById("videoAspect")
      .value = "ratio-portrait";


    document
      .getElementById("saveVideoBtn")
      .textContent =
      "ДОБАВИТЬ ВИДЕО";


    document
      .getElementById("cancelEditBtn")
      .style.display =
      "none";

  }


  /*
    ============================================
    СПИСОК В АДМИНКЕ
    ============================================
  */

  function updateVideoList() {

    const list =
      document.getElementById("videoList");


    if (!videos.length) {

      list.innerHTML =
        `
        <p style="
          text-align:center;
          color:#999;
        ">
          Нет видео
        </p>
        `;

      return;

    }


    list.innerHTML =
      videos.map(video => {

        return `
          <div class="video-list-item">

            <div class="video-list-item-info">

              <div class="video-list-item-title">
                ${escapeHtml(video.title || "")}
              </div>

              <div class="video-list-item-url">
                ${escapeHtml(video.url || "")}
              </div>

            </div>

            <div class="video-actions">

              <button
                class="video-edit-btn"
                onclick="editVideo('${escapeJs(video.id)}')"
              >
                ✎ РЕДАКТИРОВАТЬ
              </button>

              <button
                class="video-list-item-delete"
                onclick="deleteVideo('${escapeJs(video.id)}')"
              >
                ✕
              </button>

            </div>

          </div>
        `;

      }).join("");

  }


  /*
    ============================================
    СТАТУС
    ============================================
  */

  function showStatus(text) {

    const status =
      document.getElementById(
        "statusMessage"
      );


    status.textContent =
      text;

    status.style.display =
      "block";


    setTimeout(() => {

      status.style.display =
        "none";

    }, 2500);

  }


  /*
    ============================================
    ПАРОЛЬ
    ============================================
  */

  function openPassword() {

    document
      .getElementById("passwordPanel")
      .classList.add("active");


    setTimeout(() => {

      document
        .getElementById("passwordInput")
        .focus();

    }, 100);

  }


  function closePassword() {

    document
      .getElementById("passwordPanel")
      .classList.remove("active");


    document
      .getElementById("passwordInput")
      .value = "";


    document
      .getElementById("errorMessage")
      .style.display =
      "none";

  }


  async function checkPassword() {

    const password =
      document
        .getElementById("passwordInput")
        .value;


    if (!password) return;


    adminSecret =
      password;


    /*
      Проверяем пароль через API
    */

    try {

      const response =
        await fetch(
          API_URL + "/videos",
          {
            headers: {
              "Authorization":
                "Bearer " + adminSecret
            }
          }
        );


      /*
        Если GET публичный,
        просто открываем админку.

        Реальная проверка секрета
        всё равно будет при POST/PUT/DELETE.
      */

      closePassword();

      openAdmin();

    }

    catch (error) {

      document
        .getElementById("errorMessage")
        .style.display =
        "block";

    }

  }


  /*
    ============================================
    АДМИНКА
    ============================================
  */

  function openAdmin() {

    document
      .getElementById("adminPanel")
      .classList.add("active");


    document.body
      .classList.add("admin-mode");


    updateVideoList();

  }


  function closeAdmin() {

    document
      .getElementById("adminPanel")
      .classList.remove("active");


    document.body
      .classList.remove("admin-mode");


    cancelEdit();

  }


  /*
    ============================================
    3 КЛИКА ПО ЛОГОТИПУ
    ============================================
  */

  document
    .getElementById("logoIcon")
    .addEventListener(
      "click",
      function() {

        logoClickCount++;


        if (logoClickTimer) {

          clearTimeout(
            logoClickTimer
          );

        }


        logoClickTimer =
          setTimeout(
            () => {

              logoClickCount = 0;

            },
            700
          );


        if (
          logoClickCount >= 3
        ) {

          logoClickCount = 0;

          openPassword();

        }

      }
    );


  /*
    ENTER
  */

  document
    .getElementById("passwordInput")
    .addEventListener(
      "keypress",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          checkPassword();

        }

      }
    );


  /*
    ============================================
    ЗАЩИТА HTML
    ============================================
  */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeJs(value) {

    return String(value ?? "")
      .replace(/\\/g, "\\\\")
      .replace(/'/g, "\\'");

  }


  /*
    ============================================
    START
    ============================================
  */

  document.addEventListener(
    "DOMContentLoaded",
    loadAllVideos
  );

</script>

</body>
</html>
