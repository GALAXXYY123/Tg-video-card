<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>POLYANA | Video Editor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Базовые настройки */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000; /* Резервный черный фон */
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* Твой фон */
    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000 url('bg.jpg') center/cover no-repeat;
      z-index: -1;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 120px; /* Отступ под кнопку */
      min-height: 100vh;
    }

    /* Заголовок */
    .header {
      text-align: center;
      padding: 40px 20px 30px;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .header p {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Лента видео */
    .video-feed {
      display: flex;
      flex-direction: column;
      gap: 30px;
      padding: 0 20px;
    }

    /* Карточка видео */
    .video-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-wrapper {
      width: 100%;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Настройки пропорций */
    .ratio-landscape { aspect-ratio: 16/9; }
    .ratio-portrait { aspect-ratio: 9/16; max-height: 75vh; }
    .ratio-square { aspect-ratio: 1/1; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Подпись под видео */
    .caption {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    /* Кнопка Telegram - Квадратная с закруглением */
    .tg-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff; /* Белый цвет для контраста с твоим фоном */
      color: #000;
      text-decoration: none;
      width: 60px;
      height: 60px;
      border-radius: 16px; /* Закругленные края квадрата */
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .tg-button:hover {
      transform: translateX(-50%) scale(1.05);
      background: #f0f0f0;
    }

    .tg-icon {
      width: 28px;
      height: 28px;
      fill: #000;
    }
  </style>
</head>
<body>

  <!-- Твой фон -->
  <div class="background"></div>

  <div class="app-container">
    <div class="header">
      <h1>POLYANA</h1>
      <p>Video Editing & Motion</p>
    </div>

    <div class="video-feed" id="videoFeed">
      <!-- Видео загрузятся сюда -->
    </div>
  </div>

  <!-- Квадратная кнопка Telegram -->
  <a href="https://t.me/POLYANA_HUB" class="tg-button" target="_blank">
    <svg class="tg-icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.03-.75 4.06-1.77 6.77-2.94 8.13-3.51 3.87-1.6 4.67-1.88 5.19-1.89.11 0 .37.03.54.17.14.12.18.28.2.45-.01.07-.01.14-.02.21z"/>
    </svg>
  </a>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // ТВОИ ВИДЕО В НОВОМ ПОРЯДКЕ
    const videoLinks = [
      {
        url: "https://player.vimeo.com/video/1137819132", // Veo rec (AI)
        aspect: "ratio-landscape",
        title: "AI Motion / Experimental"
      },
      {
        url: "https://player.vimeo.com/video/1137811725", // KARMA OMUT
        aspect: "ratio-landscape",
        title: "Tattoo Process / Karma"
      },
      {
        url: "https://player.vimeo.com/video/1137818000", // Vpiska
        aspect: "ratio-portrait",
        title: "Underground / Lifestyle"
      },
      {
        url: "https://player.vimeo.com/video/1137814296", // Stu day
        aspect: "ratio-landscape",
        title: "Tattoo Session / Details"
      },
      {
        url: "https://player.vimeo.com/video/1137821627", // MaysPizza
        aspect: "ratio-square",
        title: "Bar & Food / Reels"
      }
    ];

    function createVimeoUrl(videoUrl) {
      const baseParams = "title=0&byline=0&portrait=0&badge=0&dnt=1&playsinline=1&autoplay=0";
      const separator = videoUrl.includes('?') ? '&' : '?';
      return `${videoUrl}${separator}${baseParams}`;
    }

    function loadAllVideos() {
      const feed = document.getElementById('videoFeed');
      feed.innerHTML = videoLinks.map(video => `
        <div class="video-card">
          <div class="video-wrapper ${video.aspect}">
            <iframe 
              src="${createVimeoUrl(video.url)}" 
              allow="fullscreen; picture-in-picture" 
              allowfullscreen 
              loading="lazy">
            </iframe>
          </div>
          <div class="caption">${video.title}</div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadAllVideos);
  </script>
</body>
</html>
