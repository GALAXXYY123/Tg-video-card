<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POLYANA | Video Editor</title>
  
  <!-- Скрипт Mave.io -->
  <script type="module" src="https://cdn.video-dns.com/npm/@maveio/components/+esm"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #fff;
      padding: 40px 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 40px;
    }
    .video-wrapper {
      background: #f5f5f5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      margin-bottom: 40px;
    }
    .caption {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>POLYANA</h1>
    <p class="subtitle">Video Editing & Motion</p>
    
    <!-- BARBER TIME -->
    <div class="video-wrapper">
      <mave-player 
        embed="trialSwQPh23mJ7" 
        aspect-ratio="auto" 
        style="display: block; width: 100%; background: center / contain no-repeat url(https://space-trial.video-dns.com/SwQPh23mJ7/thumbnail.jpg?e=1788022731994473); aspect-ratio: 9 / 16;"
      ></mave-player>
    </div>
    <div class="caption">BARBER TIME</div>
  </div>
</body>
</html>
