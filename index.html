      font-weight: 500;

    }

    /* VIDEO FEED */
    /* ========================= */

    .video-feed {

      display: flex;

      flex-direction: column;

      gap: 40px;

      padding: 0 20px;

    }


    .video-card {

      display: flex;

      flex-direction: column;

      align-items: center;

      position: relative;

    }


    .video-wrapper {

      width: 100%;

      background: #f5f5f5;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 8px 24px

    }


    .ratio-landscape {

      aspect-ratio: 16 / 9;

    }


    .ratio-portrait {

      aspect-ratio: 9 / 16;

      max-height: 75vh;

    }


    .ratio-square {

      aspect-ratio: 1 / 1;

    }


    .ratio-4-3 {

      aspect-ratio: 4 / 3;

    }


    iframe {

      width: 100%;

      height: 100%;

      border: none;

      display: block;

    }


    .caption {

      margin-top: 12px;

      font-size: 14px;

      font-weight: 600;

      color: #333;

      text-align: center;

      letter-spacing: 0.05em;

      text-transform: uppercase;

    }


    /* ========================= */
    /* ADMIN BUTTONS ON VIDEO */
    /* ========================= */

    .video-actions {

      position: absolute;

      top: 10px;

      right: 10px;

      display: none;

      gap: 8px;

      z-index: 20;

    }


    body.admin-mode .video-actions {

      display: flex;

    }


    .edit-btn,

      width: 44px;

      height: 44px;

      border: none;

      border-radius: 10px;

      color: #fff;

      cursor: pointer;

      font-size: 20px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .edit-btn {

      background: #000;

    }


    .delete-btn {

      background: #ff0000;

    }


    /* ========================= */
    /* TELEGRAM */
    /* ========================= */

    .tg-button {

      position: fixed;

      bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );

      left: 50%;

      transform: translateX(-50%);

      background: #000;

      color: #fff;

      text-decoration: none;

      width: 60px;

      height: 60px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.2);

      transition: all 0.3s ease;

      z-index: 100;

    }


    .tg-button:active {

      transform:
        translateX(-50%)

      background: #333;

    /* ========================= */
    /* PASSWORD PANEL */

    .password-panel {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background: #fff;

      z-index: 1000;

      overflow: hidden;

    }


    .password-panel.active {

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .crt-effect {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background:
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.03),
          rgba(0,0,0,0.03) 1px,
          transparent 1px,
          transparent 2px
        );

      pointer-events: none;

    }


    .glitch-bg {

      position: absolute;

      width: 100%;

      height: 100%;

      overflow: hidden;

    }


    .glitch-line {

      position: absolute;

      width: 100%;

      height: 2px;

      background:
        rgba(0,0,0,0.1);

      animation:
        glitchMove
        3s
        infinite;

    }


    .glitch-line:nth-child(1) {
      top: 20%;
    }

    .glitch-line:nth-child(2) {
      top: 40%;
    }

    .glitch-line:nth-child(3) {
      top: 60%;
    }

    .glitch-line:nth-child(4) {
      top: 80%;
    }


    @keyframes glitchMove {

      0%,
      100% {

        transform:
          translateX(0);

        opacity: 0.3;

      }

      50% {

        transform:
          translateX(-10px);

        opacity: 0.6;

      }

    }

  <script>


    /* ========================= */
    /* TELEGRAM */
    /* ========================= */

    const tg =
      window.Telegram?.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }



    /* ========================= */
    /* API */
    /* ========================= */

    const API_URL =
      "https://polyana-video-api.another-galaxxy.workers.dev";


    let ADMIN_SECRET = "";


    let videos = [];


    let editingVideoId = null;


    let logoClickCount = 0;


    let logoClickTimer = null;



    /* ========================= */
    /* SECURITY */
    /* ========================= */

    function escapeHtml(text) {

      return String(text || "")

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }



    /* ========================= */
    /* PLATFORM */
    /* ========================= */

    function detectPlatform(url) {

      try {

        const u =
          new URL(url);


        const host =
          u.hostname
            .replace(/^www\./, "")
            .toLowerCase();


        if (
          host === "vimeo.com" ||
          host === "player.vimeo.com"
        ) {

          return "vimeo";

        }


        if (
          host === "vk.com" ||
          host === "m.vk.com" ||
          host === "vkvideo.ru"
        ) {

          return "vk";

        }


        if (
          host === "rutube.ru" ||
          host === "m.rutube.ru"
        ) {

          return "rutube";

        }

      }

      catch (error) {

        return null;

      }


      return null;

    }



    /* ========================= */
    /* ASPECT */
    /* ========================= */

    function getAspectClass(aspect) {

      const map = {

        "9:16":
          "ratio-portrait",

        "16:9":
          "ratio-landscape",

        "1:1":
          "ratio-square",

        "4:3":
          "ratio-4-3"

      };


      return map[aspect] ||
        "ratio-portrait";

    }



    /* ========================= */
    /* VIMEO */
    /* ========================= */

    function createVimeoUrl(videoUrl) {

      let url =
        videoUrl.trim();


      if (
        url.includes("vimeo.com/") &&
        !url.includes("player.vimeo.com/video/")
      ) {

        const match =
          url.match(/vimeo\.com\/(?:video\/)?(\d+)/);


        if (match) {

          url =
            "https://player.vimeo.com/video/" +
            match[1];

        }

      }


      const separator =
        url.includes("?")
          ? "&"
          : "?";


      return (
        url +
        separator +
        "title=0" +
        "&byline=0" +
        "&portrait=0" +
        "&badge=0" +
        "&dnt=1" +
        "&playsinline=1" +
        "&autoplay=1" +
        "&muted=1" +
        "&loop=1"
      );

    }



    /* ========================= */
    /* VK */
    /* ========================= */

    function createVKUrl(videoUrl) {

      return videoUrl;

    }



    /* ========================= */
    /* RUTUBE */
    /* ========================= */

    function createRutubeUrl(videoUrl) {

      let url =
        videoUrl.trim();


      try {

        if (
          url.includes("rutube.ru/video/")
        ) {

          const match =
            url.match(
              /rutube\.ru\/video\/([^/?#]+)/
            );


          if (match) {

            return (
              "https://rutube.ru/play/embed/" +
              match[1]
            );

          }

        }

      }

      catch (error) {}


      return url;

    }



    /* ========================= */
    /* EMBED URL */
    /* ========================= */

    function getEmbedUrl(video) {

      const platform =
        video.platform ||
        detectPlatform(video.url);


      if (
        platform === "vimeo"
      ) {

        return createVimeoUrl(
          video.url
        );

      }


      if (
        platform === "rutube"
      ) {

        return createRutubeUrl(
          video.url
        );

      }


      if (
        platform === "vk"
      ) {

        return createVKUrl(
          video.url
        );

      }


      return video.url;

    }



    /* ========================= */
    /* LOAD VIDEOS */
    /* ========================= */

    async function loadAllVideos() {

      const feed =
        document.getElementById(
          "videoFeed"
        );


      feed.innerHTML = `
        <div class="status">
          Загрузка видео...
        </div>
      `;


      try {

        const response =
          await fetch(
            API_URL + "/videos"
          );


        const data =
          await response.json();


        if (
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Ошибка загрузки"
          );

        }


        videos =
          Array.isArray(data.videos)
            ? data.videos
            : [];


        renderVideos();


        updateVideoList();

      }

      catch (error) {

        console.error(error);


        feed.innerHTML = `
          <div class="status">
            Не удалось загрузить видео
          </div>
        `;

      }

    }



    /* ========================= */
    /* RENDER VIDEOS */
    /* ========================= */

    function renderVideos() {

      const feed =
        document.getElementById(
          "videoFeed"
        );


      if (
        videos.length === 0
      ) {

        feed.innerHTML = `
          <div class="status">
            Пока нет видео
          </div>
        `;

        return;

      }


      feed.innerHTML =
        videos
          .map(video => {


            const embedUrl =
              getEmbedUrl(video);


            const aspectClass =
              getAspectClass(
                video.aspect
              );


            return `

              <div
                class="video-card"
                data-id="${escapeHtml(video.id)}"
              >


                <div class="video-actions">


                  <button
                    class="edit-btn"
                    onclick="startEdit('${escapeHtml(video.id)}')"
                    title="Редактировать"
                  >
                    ✎
                  </button>


                  <button
                    class="delete-btn"
                    onclick="deleteVideo('${escapeHtml(video.id)}')"
                    title="Удалить"
                  >
                    ✕
                  </button>


                </div>



                <div
                  class="video-wrapper ${aspectClass}"
                >


                  <iframe

                    src="${escapeHtml(embedUrl)}"

                    allow="
                      autoplay;
                      fullscreen;
                      picture-in-picture;
                      encrypted-media
                    "

                    allowfullscreen

                    loading="lazy"

                  ></iframe>


                </div>



                <div class="caption">

                  ${escapeHtml(video.title)}

                </div>


              </div>

            `;

          })

          .join("");

    }



    /* ========================= */
    /* PASSWORD */
    /* ========================= */

    function openPassword() {

      document
        .getElementById(
          "passwordPanel"
        )
        .classList
        .add("active");


      setTimeout(() => {

        document
          .getElementById(
            "passwordInput"
          )
          .focus();

      }, 100);

    }



    function closePassword() {

      document
        .getElementById(
          "passwordPanel"
        )
        .classList
        .remove("active");


      document
        .getElementById(
          "passwordInput"
        )
        .value = "";


      document
        .getElementById(
          "errorMessage"
        )
        .style.display =
        "none";

    }



    function checkPassword() {

      const password =
        document
          .getElementById(
            "passwordInput"
          )
          .value
          .trim();


      if (!password) {

        return;

      }


      ADMIN_SECRET =
        password;


      closePassword();


      openAdmin();

    }



    /* ========================= */
    /* ADMIN */
    /* ========================= */

    function openAdmin() {

      document
        .getElementById(
          "adminPanel"
        )
        .classList
        .add("active");


      document.body
        .classList
        .add("admin-mode");


      updateVideoList();

    }



    function closeAdmin() {

      document
        .getElementById(
          "adminPanel"
        )
        .classList
        .remove("active");


      document.body
        .classList
        .remove("admin-mode");


      cancelEdit();

    }



    /* ========================= */
    /* SAVE VIDEO */
    /* ========================= */

    async function saveVideo() {

      const url =
        document
          .getElementById(
            "videoUrl"
          )
          .value
          .trim();


      const title =
        document
          .getElementById(
            "videoTitle"
          )
          .value
          .trim();


      const aspect =
        document
          .getElementById(
            "videoAspect"
          )
          .value;


      if (!url) {

        alert(
          "Вставь ссылку на видео!"
        );

        return;

      }


      const platform =
        detectPlatform(url);


      if (!platform) {

        alert(
          "Разрешены только Vimeo, VK Видео и RUTUBE!"
        );

        return;

      }


      const button =
        document.getElementById(
          "saveVideoBtn"
        );


      button.disabled = true;


      button.textContent =
        "ЗАГРУЗКА...";


      try {

        let response;


        if (
          editingVideoId
        ) {

          response =
            await fetch(
              API_URL +
              "/videos/" +
              encodeURIComponent(
                editingVideoId
              ),
              {

                method: "PUT",

                headers: {

                  "Content-Type":
                    "application/json",

                  "Authorization":
                    "Bearer " +
                    ADMIN_SECRET

                },

                body:
                  JSON.stringify({

                    url,

                    title,

                    aspect

                  })

              }
            );

        }

        else {

          response =
            await fetch(
              API_URL +
              "/videos",
              {

                method: "POST",

                headers: {

                  "Content-Type":
                    "application/json",

                  "Authorization":
                    "Bearer " +
                    ADMIN_SECRET

                },

                body:
                  JSON.stringify({

                    url,

                    title,

                    aspect

                  })

              }
            );

        }


        const data =
          await response.json();


        if (
          response.status === 401
        ) {

          throw new Error(
            "Неверный ADMIN SECRET"
          );

        }


        if (
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Ошибка сохранения"
          );

        }


        cancelEdit();


        await loadAllVideos();


        alert(
          editingVideoId
            ? "Видео обновлено!"
            : "Видео добавлено!"
        );

      }

      catch (error) {

        console.error(error);


        alert(
          error.message ||
          "Ошибка сохранения"
        );

      }

      finally {

        button.disabled = false;


        button.textContent =
          editingVideoId
            ? "СОХРАНИТЬ ИЗМЕНЕНИЯ"
            : "ДОБАВИТЬ ВИДЕО";

      }

    }



    /* ========================= */
    /* EDIT VIDEO */
    /* ========================= */

    function startEdit(id) {

      const video =
        videos.find(
          v =>
            String(v.id) ===
            String(id)
        );


      if (!video) {

        alert(
          "Видео не найдено"
        );

        return;

      }


      editingVideoId =
        video.id;


      document
        .getElementById(
          "videoUrl"
        )
        .value =
        video.url;


      document
        .getElementById(
          "videoTitle"
        )
        .value =
        video.title;


      document
        .getElementById(
          "videoAspect"
        )
        .value =
        video.aspect;


      document
        .getElementById(
          "adminTitle"
        )
        .textContent =
        "РЕДАКТИРОВАНИЕ ВИДЕО";


      document
        .getElementById(
          "saveVideoBtn"
        )
        .textContent =
        "СОХРАНИТЬ ИЗМЕНЕНИЯ";


      document
        .getElementById(
          "cancelEditBtn"
        )
        .style.display =
        "block";


      openAdmin();


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }



    function cancelEdit() {

      editingVideoId =
        null;


      document
        .getElementById(
          "videoUrl"
        )
        .value =
        "";


      document
        .getElementById(
          "videoTitle"
        )
        .value =
        "";


      document
        .getElementById(
          "videoAspect"
        )
        .value =
        "9:16";


      document
        .getElementById(
          "adminTitle"
        )
        .textContent =
        "УПРАВЛЕНИЕ ВИДЕО";


      document
        .getElementById(
          "saveVideoBtn"
        )
        .textContent =
        "ДОБАВИТЬ ВИДЕО";


      document
        .getElementById(
          "cancelEditBtn"
        )
        .style.display =
        "none";

    }



    /* ========================= */
    /* DELETE */
    /* ========================= */

    async function deleteVideo(id) {

      if (
        !ADMIN_SECRET
      ) {

        alert(
          "Сначала войди в панель управления"
        );

        return;

      }


      const confirmed =
        confirm(
          "Удалить это видео?"
        );


      if (!confirmed) {

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/videos/" +
            encodeURIComponent(id),
            {

              method:
                "DELETE",

              headers: {

                "Authorization":
                  "Bearer " +
                  ADMIN_SECRET

              }

            }
          );


        const data =
          await response.json();


        if (
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Ошибка удаления"
          );

        }


        await loadAllVideos();


      }

      catch (error) {

        console.error(error);


        alert(
          error.message ||
          "Ошибка удаления"
        );

      }

    }



    /* ========================= */
    /* ADMIN VIDEO LIST */
    /* ========================= */

    function updateVideoList() {

      const list =
        document.getElementById(
          "videoList"
        );


      if (!list) {

        return;

      }


      if (
        videos.length === 0
      ) {

        list.innerHTML = `
          <div class="status">
            Нет видео
          </div>
        `;

        return;

      }


      list.innerHTML =
        videos
          .map(video => `


            <div class="video-list-item">


              <div class="video-list-item-info">


                <div class="video-list-item-title">

                  ${escapeHtml(video.title)}

                </div>


                <div class="video-list-item-url">

                  ${escapeHtml(video.url)}

                </div>


              </div>



              <div class="video-list-item-actions">


                <button
                  class="small-edit-btn"
                  onclick="startEdit('${escapeHtml(video.id)}')"
                  title="Редактировать"
                >
                  ✎
                </button>


                <button
                  class="video-list-item-delete"
                  onclick="deleteVideo('${escapeHtml(video.id)}')"
                  title="Удалить"
                >
                  ✕
                </button>


              </div>


            </div>


          `)

          .join("");

    }



    /* ========================= */
    /* LOGO 3 CLICKS */
    /* ========================= */

    document
      .getElementById(
        "logoIcon"
      )
      .addEventListener(
        "click",
        function() {


          logoClickCount++;


          if (
            logoClickTimer
          ) {

            clearTimeout(
              logoClickTimer
            );

          }


          logoClickTimer =
            setTimeout(() => {

              logoClickCount = 0;

            }, 700);


          if (
            logoClickCount >= 3
          ) {

            logoClickCount = 0;


            openPassword();

          }

        }
      );



    /* ========================= */
    /* ENTER PASSWORD */
    /* ========================= */

    document
      .getElementById(
        "passwordInput"
      )
      .addEventListener(
        "keypress",
        function(e) {

          if (
            e.key === "Enter"
          ) {

            checkPassword();

          }

        }
      );



    /* ========================= */
    /* START */
    /* ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      loadAllVideos
    );


  </script>


</body>
