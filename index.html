<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>POLYANA | Video Editor</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a1a' width='100' height='100' rx='20'/><path fill='%23fff' d='M35 35h30v30H35V35zm-5 10h5v5h-5v-5zm35 0h5v5h-5v-5z'/><circle fill='none' stroke='%23fff' stroke-width='3' cx='50' cy='50' r='20'/></svg>">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #ffffff;
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif;
      color: #111;
    }

    .app-container {
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 120px;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 40px 20px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }
    
    .logo-icon {
      width: 60px;
      height: 60px;
      background: #1a1a1a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-icon svg {
      width: 35px;
      height: 35px;
      fill: #fff;
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
    }

    .header p {
      font-size: 14px;
      color: #666;
      margin-top: 0;
      font-weight: 500;
    }

    .video-feed {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 0 20px;
    }

    .video-card {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .video-wrapper {
      width: 100%;
      background: #f5f5f5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    .ratio-landscape { aspect-ratio: 16/9; }
    .ratio-portrait { aspect-ratio: 9/16; max-height: 75vh; }
    .ratio-square { aspect-ratio: 1/1; }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .caption {
      margin-top: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .tg-button {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #000;
      color: #fff;
      text-decoration: none;
      width: 60px;
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      z-index: 100;
    }

    .tg-button:hover {
      transform: translateX(-50%) scale(1.05);
      background: #333;
    }

    .tg-icon {
      width: 28px;
      height: 28px;
      fill: #fff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <path d="M20 4h-3.17L15 2H9L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-5 11.5V13H9v2.5L5.5 12 9 8.5V11h6V8.5l3.5 3.5-3.5 3.5z"/>
        </svg>
      </div>
      <h1>POLYANA</h1>
      <p>Video Editing & Motion</p>
    </div>

    <div class="video-feed" id="videoFeed">
      <!-- Видео загрузятся сюда -->
    </div>
  </div>

  <a href="https://t.me/POLYANA_HUB" class="tg-button" target="_blank">
    <svg class="tg-icon" viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.69-.52.36-1 .53-1.42.52-.47-.01-1.37-.26-2.03-.48-.82-.27-1.47-.42-1.42-.88.03-.24.38-.49 1.03-.75 4.06-1.77 6.77-2.94 8.13-3.51 3.87-1.6 4.67-1.88 5.19-1.89.11 0 .37.03.54.17.14.12.18.28.2.45-.01.07-.01.14-.02.21z"/>
    </svg>
  </a>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // AI видео всегда ПЕРВОЕ
    const aiVideo = { 
      url: "https://player.vimeo.com/video/1137819132", 
      aspect: "ratio-landscape", 
      title: "AI Motion / Experimental" 
    };

    // Остальные видео добавляются ПОСЛЕ AI
    const otherVideos = [
      { 
        url: "https://player.vimeo.com/video/1222328524", 
        aspect: "ratio-portrait", 
        title: "SABOTAGE HHHB" 
      },
      { url: "https://player.vimeo.com/video/1137811725", aspect: "ratio-landscape", title: "Tattoo Process / Karma" },
      { url: "https://player.vimeo.com/video/1137818000", aspect: "ratio-portrait", title: "Underground / Lifestyle" },
      { url: "https://player.vimeo.com/video/1137814296", aspect: "ratio-landscape", title: "Tattoo Session / Details" },
      { url: "https://player.vimeo.com/video/1137821627", aspect: "ratio-square", title: "Bar & Food / Reels" }
    ];

    // Объединяем: AI + остальные
    const videoLinks = [aiVideo, ...otherVideos];

    function createVimeoUrl(videoUrl) {
      const baseParams = "title=0&byline=0&portrait=0&badge=0&dnt=1&playsinline=1&autoplay=1&muted=1";
      const separator = videoUrl.includes('?') ? '&' : '?';
      return `${videoUrl}${separator}${baseParams}`;
    }

    function loadAllVideos() {
      const feed = document.getElementById('videoFeed');
      feed.innerHTML = videoLinks.map(video => `
        <div class="video-card">
          <div class="video-wrapper ${video.aspect}">
            <iframe 
              src="${createVimeoUrl(video.url)}" 
              allow="autoplay; fullscreen; picture-in-picture" 
              allowfullscreen 
              loading="lazy">
            </iframe>
          </div>
          <div class="caption">${video.title}</div>
        </div>
      `).join('');
    }

    // Функция для добавления нового видео (после AI)
    window.addNewVideo = function(url, title, aspect = "ratio-landscape") {
      otherVideos.push({ url, title, aspect });
      videoLinks.length = 0;
      videoLinks.push(aiVideo);
      videoLinks.push(...otherVideos);
      loadAllVideos();
      console.log(`✅ Добавлено: ${title}`);
    }

    document.addEventListener('DOMContentLoaded', loadAllVideos);
  </script>
</body>
</html>
