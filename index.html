<!doctype html>

<html lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <title>POLYANA | Video Editor</title>


  <script src="https://telegram.org/js/telegram-web-app.js"></script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      height: 100%;
      margin: 0;

      background-color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      color: #111;

      -webkit-font-smoothing: antialiased;

      overscroll-behavior: none;

    }


    .app-container {

      max-width: 600px;

      margin: 0 auto;

      min-height: 100vh;

      padding-top:
        env(safe-area-inset-top);

      padding-bottom:
        calc(
          120px +
          env(safe-area-inset-bottom)
        );

    }


    /* ======================================
       HEADER
    ====================================== */

    .header {

      text-align: center;

      padding:
        40px
        20px
        30px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 15px;

    }


    .logo-icon {

      width: 60px;

      height: 60px;

      background: #1a1a1a;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      user-select: none;

      transition:
        transform 0.2s;

    }


    .logo-icon:active {

      transform:
        scale(0.95);

    }


    .logo-icon svg {

      width: 35px;

      height: 35px;

      fill: #fff;

    }


    .header h1 {

      font-size: 28px;

      font-weight: 800;

      letter-spacing: 0.15em;

      text-transform: uppercase;

      margin: 0;

    }


    .header p {

      font-size: 14px;

      color: #666;

      margin-top: 0;

      font-weight: 500;

    }


    /* ======================================
       VIDEO FEED
    ====================================== */

    .video-feed {

      display: flex;

      flex-direction: column;

      gap: 40px;

      padding: 0 20px;

    }


    .video-card {

      display: flex;

      flex-direction: column;

      align-items: center;

      position: relative;

    }


    .video-wrapper {

      width: 100%;

      background: #f5f5f5;

      border-radius: 16px;

      overflow: hidden;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.06);

    }


    .ratio-landscape {

      aspect-ratio: 16 / 9;

    }


    .ratio-portrait {

      aspect-ratio: 9 / 16;

      max-height: 75vh;

    }


    .ratio-square {

      aspect-ratio: 1 / 1;

    }


    .ratio-4-3 {

      aspect-ratio: 4 / 3;

    }


    iframe {

      width: 100%;

      height: 100%;

      border: none;

      display: block;

    }


    .caption {

      margin-top: 12px;

      font-size: 14px;

      font-weight: 600;

      color: #333;

      text-align: center;

      letter-spacing: 0.05em;

      text-transform: uppercase;

    }


    /* ======================================
       DELETE BUTTON
    ====================================== */

    .delete-btn {

      position: absolute;

      top: 10px;

      right: 10px;

      width: 44px;

      height: 44px;

      background:
        rgba(255,0,0,0.9);

      border: none;

      border-radius: 10px;

      color: white;

      font-size: 24px;

      cursor: pointer;

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 10;

    }


    body.admin-mode .delete-btn {

      display: flex;

    }


    /* ======================================
       TELEGRAM
    ====================================== */

    .tg-button {

      position: fixed;

      bottom:
        calc(
          30px +
          env(safe-area-inset-bottom)
        );

      left: 50%;

      transform:
        translateX(-50%);

      background: #000;

      color: #fff;

      text-decoration: none;

      width: 60px;

      height: 60px;

      border-radius: 16px;

      display: flex;

      align-items: center;

      justify-content: center;

      box-shadow:
        0 8px 24px
        rgba(0,0,0,0.2);

      z-index: 100;

    }


    .tg-icon {

      width: 28px;

      height: 28px;

      fill: #fff;

    }


    /* ======================================
       PASSWORD PANEL
    ====================================== */

    .password-panel {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background: #fff;

      z-index: 1000;

      overflow: hidden;

    }


    .password-panel.active {

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .password-content {

      position: relative;

      background: #fff;

      border: 3px solid #000;

      border-radius: 20px;

      padding: 30px 25px;

      max-width: 450px;

      width: 95%;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.2);

    }


    .password-title {

      font-size: 24px;

      font-weight: 900;

      letter-spacing: 0.1em;

      text-transform: uppercase;

      text-align: center;

      margin-bottom: 30px;

    }


    .password-input {

      width: 100%;

      padding: 18px;

      font-size: 16px;

      font-weight: 600;

      text-align: center;

      letter-spacing: 0.15em;

      border: 3px solid #000;

      border-radius: 12px;

      margin-bottom: 25px;

    }


    .password-btn {

      width: 100%;

      padding: 18px;

      background: #000;

      color: #fff;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    .close-password {

      position: absolute;

      top: 20px;

      right: 20px;

      width: 44px;

      height: 44px;

      background: #000;

      border: none;

      border-radius: 10px;

      color: #fff;

      font-size: 24px;

      cursor: pointer;

    }


    .error-message {

      text-align: center;

      color: #ff0000;

      font-weight: 600;

      margin-top: 20px;

      display: none;

    }


    /* ======================================
       ADMIN
    ====================================== */

    .admin-panel {

      display: none;

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background: #fff;

      z-index: 1001;

      overflow-y: auto;

      padding: 20px;

    }


    .admin-panel.active {

      display: block;

    }


    .admin-content {

      max-width: 600px;

      margin: 0 auto;

      background: #fff;

      border: 3px solid #000;

      border-radius: 20px;

      padding: 25px 20px;

    }


    .admin-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 25px;

    }


    .admin-header h2 {

      margin: 0;

      font-size: 20px;

      font-weight: 800;

      letter-spacing: 0.05em;

    }


    .close-btn {

      width: 44px;

      height: 44px;

      background: #000;

      border: none;

      border-radius: 10px;

      color: #fff;

      font-size: 24px;

      cursor: pointer;

    }


    .form-group {

      margin-bottom: 20px;

    }


    .form-group label {

      display: block;

      margin-bottom: 8px;

      font-weight: 600;

      font-size: 14px;

    }


    .form-group input,
    .form-group select {

      width: 100%;

      padding: 16px;

      border: 2px solid #000;

      border-radius: 12px;

      font-size: 16px;

      font-family: inherit;

    }


    .add-btn {

      width: 100%;

      padding: 18px;

      background: #000;

      color: #fff;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

      margin-bottom: 20px;

    }


    .cancel-edit-btn {

      width: 100%;

      padding: 14px;

      background: #fff;

      color: #000;

      border: 2px solid #000;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      margin-bottom: 20px;

      display: none;

    }


    .video-list {

      border-top: 2px solid #000;

      padding-top: 20px;

    }


    .video-list-item {

      padding: 14px;

      background: #f5f5f5;

      border: 2px solid #000;

      border-radius: 10px;

      margin-bottom: 10px;

    }


    .video-list-item-info {

      min-width: 0;

    }


    .video-list-item-title {

      font-weight: 700;

      font-size: 14px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .video-list-item-url {

      font-size: 12px;

      color: #666;

      margin-top: 5px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    .video-actions {

      display: flex;

      gap: 8px;

      margin-top: 12px;

    }


    .edit-btn {

      flex: 1;

      height: 42px;

      background: #000;

      color: #fff;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 700;

    }


    .video-list-item-delete {

      flex: 1;

      height: 42px;

      background: #ff0000;

      color: #fff;

      border: none;

      border-radius: 8px;

      cursor: pointer;

      font-weight: 700;

    }


    .export-import {

      display: flex;

      gap: 10px;

      margin-top: 20px;

      padding-top: 20px;

      border-top: 2px solid #000;

    }


    .export-btn,
    .import-btn {

      flex: 1;

      padding: 16px;

      border: 2px solid #000;

      border-radius: 10px;

      background: #fff;

      color: #000;

      font-weight: 600;

      cursor: pointer;

      font-size: 14px;

    }


    .reset-btn {

      width: 100%;

      padding: 14px;

      margin-top: 10px;

      background: #fff;

      color: #ff0000;

      border: 2px solid #ff0000;

      border-radius: 10px;

      font-weight: 700;

      cursor: pointer;

    }


    .status-message {

      text-align: center;

      padding: 15px;

      color: #777;

      font-size: 14px;

    }


    @media (max-width: 500px) {

      .admin-header h2 {

        font-size: 18px;

      }

    }

  </style>

</head>


<body>

  <a

  <script>


    // ======================================
    // TELEGRAM
    // ======================================

    const tg =
      window.Telegram?.WebApp;


    if (tg) {

      tg.ready();

      tg.expand();

    }


    // ======================================
    // API
    // ======================================

    const API_URL =
      "https://polyana-video-api.another-galaxxy.workers.dev";


    // ======================================
    // ПАРОЛЬ
    // ======================================

    const ADMIN_SECRET =
      "HUB2026";


    // ======================================
    // STATE
    // ======================================

    let videos = [];

    let editingVideoId = null;

    let logoClickCount = 0;

    let logoClickTimer = null;


    // ======================================
    // API REQUEST
    // ======================================

    async function apiRequest(
      path,
      options = {}
    ) {

      const headers = {
        ...(options.headers || {})
      };


      if (ADMIN_SECRET) {

        headers.Authorization =
          "Bearer " + ADMIN_SECRET;

      }


      if (
        options.body &&
        !headers["Content-Type"]
      ) {

        headers["Content-Type"] =
          "application/json";

      }


      const response =
        await fetch(
          API_URL + path,
          {
            ...options,
            headers
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка API"
        );

      }


      return data;

    }


    // ======================================
    // ЗАГРУЗИТЬ ВИДЕО
    // ======================================

    async function loadAllVideos() {

      const feed =
        document.getElementById(
          "videoFeed"
        );


      feed.innerHTML = `
        <div class="status-message">
          Загрузка видео...
        </div>
      `;


      try {

        const data =
          await fetch(
            API_URL + "/videos"
          );


        const result =
          await data.json();


        videos =
          result.videos || [];


        renderVideos();


        updateVideoList();


      } catch (error) {

        console.error(error);


        feed.innerHTML = `
          <div class="status-message">
            Не удалось загрузить видео
          </div>
        `;

      }

    }


    // ======================================
    // HTML SAFE
    // ======================================

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // ======================================
    // СОЗДАТЬ EMBED URL
    // ======================================

    function createEmbedUrl(video) {

      const url =
        String(video.url || "");


      // ====================================
      // VIMEO
      // ====================================

      if (video.platform === "vimeo") {

        let vimeoUrl = url;


        if (
          url.includes("vimeo.com/") &&
          !url.includes("player.vimeo.com")
        ) {

          const match =
            url.match(
              /vimeo\.com\/(?:video\/)?(\d+)/
            );


          if (match) {

            vimeoUrl =
              "https://player.vimeo.com/video/" +
              match[1];

          }

        }


        const separator =
          vimeoUrl.includes("?")
            ? "&"
            : "?";


        return (
          vimeoUrl +
          separator +
          "title=0" +
          "&byline=0" +
          "&portrait=0" +
          "&badge=0" +
          "&dnt=1" +
          "&playsinline=1" +
          "&autoplay=1" +
          "&muted=1" +
          "&loop=1"
        );

      }


      // ====================================
      // RUTUBE
      // ====================================

      if (video.platform === "rutube") {

        const match =
          url.match(
            /rutube\.ru\/video\/([a-zA-Z0-9]+)/i
          );


        if (match) {

          return (
            "https://rutube.ru/play/embed/" +
            match[1]
          );

        }


        return url;

      }


      // ====================================
      // VK
      // ====================================

      if (video.platform === "vk") {

        // Если уже embed-ссылка

        if (
          url.includes("video_ext.php")
        ) {

          return url;

        }


        // Обычная VK ссылка
        // Например:
        // vk.com/video-123_456

        const match =
          url.match(
            /video(-?\d+)_(\d+)/
          );


        if (match) {

          const oid =
            match[1];

          const id =
            match[2];


          return (
            "https://vk.com/video_ext.php" +
            "?oid=" + oid +
            "&id=" + id +
            "&hd=2" +
            "&autoplay=1"
          );

        }


        return url;

      }


      return url;

    }


    // ======================================
    // ASPECT CLASS
    // ======================================

    function getAspectClass(aspect) {

      switch (aspect) {

        case "16:9":
          return "ratio-landscape";

        case "1:1":
          return "ratio-square";

        case "4:3":
          return "ratio-4-3";

        case "9:16":
        default:
          return "ratio-portrait";

      }

    }


    // ======================================
    // RENDER VIDEOS
    // ======================================

    function renderVideos() {

      const feed =
        document.getElementById(
          "videoFeed"
        );


      if (!videos.length) {

        feed.innerHTML = `
          <div class="status-message">
            Пока нет видео
          </div>
        `;

        return;

      }


      feed.innerHTML =
        videos.map(video => {

          const embedUrl =
            createEmbedUrl(video);


          const aspectClass =
            getAspectClass(
              video.aspect
            );


          return `

            <div
              class="video-card"
              data-id="${escapeHtml(video.id)}"
            >

              <button
                class="delete-btn"
                onclick="deleteVideo('${escapeHtml(video.id)}')"
              >
                ✕
              </button>


              <div
                class="video-wrapper ${aspectClass}"
              >

                <iframe

                  src="${escapeHtml(embedUrl)}"

                  allow="autoplay; fullscreen; picture-in-picture; encrypted-media"

                  allowfullscreen

                  loading="lazy"

                ></iframe>

              </div>


              <div class="caption">

                ${escapeHtml(video.title)}

              </div>

            </div>

          `;

        }).join("");

    }


    // ======================================
    // SAVE VIDEO
    // ======================================

    async function saveVideo() {

      const url =
        document
          .getElementById("videoUrl")
          .value
          .trim();


      const title =
        document
          .getElementById("videoTitle")
          .value
          .trim();


      const aspect =
        document
          .getElementById("videoAspect")
          .value;


      if (!url) {

        alert(
          "Вставь ссылку на видео!"
        );

        return;

      }


      if (!title) {

        alert(
          "Напиши название видео!"
        );

        return;

      }


      const button =
        document.getElementById(
          "saveVideoBtn"
        );


      const oldText =
        button.textContent;


      button.textContent =
        "СОХРАНЕНИЕ...";


      button.disabled = true;


      try {

        if (editingVideoId) {

          await apiRequest(
            "/videos/" +
            encodeURIComponent(
              editingVideoId
            ),
            {
              method: "PUT",

              body:
                JSON.stringify({
                  url,
                  title,
                  aspect
                })
            }
          );


          alert(
            "Видео обновлено!"
          );


          cancelEdit();

        } else {

          await apiRequest(
            "/videos",
            {
              method: "POST",

              body:
                JSON.stringify({
                  url,
                  title,
                  aspect
                })
            }
          );


          alert(
            "Видео добавлено!"
          );


          document
            .getElementById("videoUrl")
            .value = "";


          document
            .getElementById("videoTitle")
            .value = "";

        }


        await loadAllVideos();


      } catch (error) {

        alert(
          error.message
        );

      } finally {

        button.disabled = false;


        if (!editingVideoId) {

          button.textContent =
            oldText;

        }

      }

    }


    // ======================================
    // EDIT VIDEO
    // ======================================

    function editVideo(id) {

      const video =
        videos.find(
          item =>
            String(item.id) === String(id)
        );


      if (!video) {
        return;
      }


      editingVideoId =
        video.id;


      document
        .getElementById("videoUrl")
        .value =
          video.url;


      document
        .getElementById("videoTitle")
        .value =
          video.title;


      document
        .getElementById("videoAspect")
        .value =
          video.aspect;


      document
        .getElementById("saveVideoBtn")
        .textContent =
          "СОХРАНИТЬ ИЗМЕНЕНИЯ";


      document
        .getElementById("cancelEditBtn")
        .style.display =
          "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    // ======================================
    // CANCEL EDIT
    // ======================================

    function cancelEdit() {

      editingVideoId = null;


      document
        .getElementById("videoUrl")
        .value = "";


      document
        .getElementById("videoTitle")
        .value = "";


      document
        .getElementById("videoAspect")
        .value = "9:16";


      document
        .getElementById("saveVideoBtn")
        .textContent =
          "ДОБАВИТЬ ВИДЕО";


      document
        .getElementById("cancelEditBtn")
        .style.display =
          "none";

    }


    // ======================================
    // DELETE
    // ======================================

    async function deleteVideo(id) {

      if (
        !confirm(
          "Удалить это видео?"
        )
      ) {
        return;
      }


      try {

        await apiRequest(
          "/videos/" +
          encodeURIComponent(id),
          {
            method: "DELETE"
          }
        );


        await loadAllVideos();


        alert(
          "Видео удалено"
        );


      } catch (error) {

        alert(
          error.message
        );

      }

    }


    // ======================================
    // VIDEO LIST
    // ======================================

    function updateVideoList() {

      const list =
        document.getElementById(
          "videoList"
        );


      if (!videos.length) {

        list.innerHTML = `
          <div class="status-message">
            Пока нет добавленных видео
          </div>
        `;

        return;

      }


      list.innerHTML =
        videos.map(video => `

          <div class="video-list-item">

            <div class="video-list-item-info">

              <div class="video-list-item-title">

                ${escapeHtml(video.title)}

              </div>


              <div class="video-list-item-url">

                ${escapeHtml(video.url)}

              </div>

            </div>


            <div class="video-actions">

              <button
                class="edit-btn"
                onclick="editVideo('${escapeHtml(video.id)}')"
              >
                РЕДАКТИРОВАТЬ
              </button>


              <button
                class="video-list-item-delete"
                onclick="deleteVideo('${escapeHtml(video.id)}')"
              >
                УДАЛИТЬ
              </button>

            </div>

          </div>

        `).join("");

    }


    // ======================================
    // RESET
    // ======================================

    async function resetVideos() {

      if (
        !confirm(
          "Это удалит текущие изменения и восстановит старые заводские видео. Продолжить?"
        )
      ) {
        return;
      }


      try {

        await apiRequest(
          "/reset",
          {
            method: "POST"
          }
        );


        await loadAllVideos();


        alert(
          "Старые видео восстановлены!"
        );


      } catch (error) {

        alert(
          error.message
        );

      }

    }


    // ======================================
    // EXPORT
    // ======================================

    function exportData() {

      const blob =
        new Blob(
          [
            JSON.stringify(
              videos,
              null,
              2
            )
          ],
          {
            type:
              "application/json"
          }
        );


      const a =
        document.createElement("a");


      a.href =
        URL.createObjectURL(blob);


      a.download =
        "polyana-videos.json";


      a.click();


      URL.revokeObjectURL(
        a.href
      );

    }


    // ======================================
    // IMPORT
    // ======================================

    async function importData(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        async function(e) {

          try {

            const data =
              JSON.parse(
                e.target.result
              );


            if (!Array.isArray(data)) {

              alert(
                "Неверный JSON файл"
              );

              return;

            }


            if (
              !confirm(
                "Импорт добавит видео в Cloudflare. Продолжить?"
              )
            ) {
              return;
            }


            for (
              const video of data
            ) {

              await apiRequest(
                "/videos",
                {
                  method: "POST",

                  body:
                    JSON.stringify({
                      url:
                        video.url,

                      title:
                        video.title ||
                        "Без названия",

                      aspect:
                        video.aspect ||
                        "9:16"
                    })
                }
              );

            }


            await loadAllVideos();


            alert(
              "Импорт завершён!"
            );


          } catch (error) {

            alert(
              "Ошибка импорта: " +
              error.message
            );

          }

        };


      reader.readAsText(file);

    }


    // ======================================
    // PASSWORD
    // ======================================

    function openPassword() {

      document
        .getElementById("passwordPanel")
        .classList.add("active");


      setTimeout(
        () => {

          document
            .getElementById("passwordInput")
            .focus();

        },
        100
      );

    }


    function closePassword() {

      document
        .getElementById("passwordPanel")
        .classList.remove("active");


      document
        .getElementById("passwordInput")
        .value = "";


      document
        .getElementById("errorMessage")
        .style.display =
          "none";

    }


    function checkPassword() {

      const password =
        document
          .getElementById("passwordInput")
          .value;


      if (
        password === ADMIN_SECRET
      ) {

        closePassword();

        openAdmin();

      } else {

        document
          .getElementById("errorMessage")
          .style.display =
            "block";


        document
          .getElementById("passwordInput")
          .value =
            "";


        setTimeout(
          () => {

            document
              .getElementById("errorMessage")
              .style.display =
                "none";

          },
          2000
        );

      }

    }


    // ======================================
    // ADMIN
    // ======================================

    function openAdmin() {

      document
        .getElementById("adminPanel")
        .classList.add("active");


      document.body
        .classList.add("admin-mode");


      updateVideoList();

    }


    function closeAdmin() {

      document
        .getElementById("adminPanel")
        .classList.remove("active");


      document.body
        .classList.remove("admin-mode");


      cancelEdit();

    }


    // ======================================
    // LOGO 3 CLICKS
    // ======================================

    document
      .getElementById("logoIcon")
      .addEventListener(
        "click",
        function() {

          logoClickCount++;


          if (logoClickTimer) {

            clearTimeout(
              logoClickTimer
            );

          }


          logoClickTimer =
            setTimeout(
              () => {

                logoClickCount = 0;

              },
              700
            );


          if (
            logoClickCount >= 3
          ) {

            logoClickCount = 0;

            openPassword();

          }

        }
      );


    // ======================================
    // ENTER PASSWORD
    // ======================================

    document
      .getElementById("passwordInput")
      .addEventListener(
        "keypress",
        function(e) {

          if (
            e.key === "Enter"
          ) {

            checkPassword();

          }

        }
      );


    // ======================================
    // START
    // ======================================

    document.addEventListener(
      "DOMContentLoaded",
      loadAllVideos
    );


  </script>


</body>
